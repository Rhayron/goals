# Cabeçalhos do SPA (a api manda os próprios via helmet).
# Fontes do Google Fonts e fotos de perfil do Google (googleusercontent) são as únicas origens externas.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src $spa_connect_src; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $spa_frame_ancestors" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options $spa_frame_options always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
